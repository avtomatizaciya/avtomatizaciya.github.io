<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр договоров | Автоматизация для бизнеса</title>
<meta name="description" content="Как выглядит реестр договоров: загрузка файлов, поиск, карточка договора и контроль сроков. Скриншоты программы на демонстрационных данных.">
<link rel="canonical" href="https://avtomatizaciya.github.io/reestr-dogovorov/">
<style>
:root{color-scheme:light;--ink:#0a2540;--sub:#425466;--line:#dce7e5;--accent:#00695e;--tint:#eaf6f2}
*{box-sizing:border-box}
body{margin:0;background:#f6f9fa;color:var(--ink);font:16px/1.6 system-ui,sans-serif}
.shell{width:min(calc(100% - 32px),1120px);margin-inline:auto}
header{padding:18px 0;background:white;border-bottom:1px solid var(--line)}
a{color:var(--accent);text-underline-offset:.2em}
a:focus-visible{outline:3px solid #0b796e;outline-offset:4px}
main{padding-block:clamp(32px,6vw,72px)}
h1{font-size:clamp(36px,7vw,66px);line-height:1.06;letter-spacing:-.045em;margin:0 0 16px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.2;margin:0 0 8px}
p{margin:0;color:var(--sub)}
.lead{font-size:clamp(18px,2.4vw,22px);max-width:43rem}
.note{margin:18px 0 28px;font-size:14px;color:var(--accent)}
figure{margin:0;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}
figure a{display:block;background:var(--tint)}
img{display:block;width:100%;height:auto}
figcaption{padding:clamp(16px,3vw,24px)}
figcaption a{display:inline-block;margin-top:10px;font-size:14px;background:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
footer{margin-top:30px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="shell"><a href="../">Автоматизация для бизнеса</a></div></header>
<main class="shell">
<h1>Реестр договоров</h1>
<p class="lead">Загружайте сканы и PDF, находите договоры по реквизитам и следите за сроками в одном окне. Файлы и распознавание остаются на компьютере или сервере компании.</p>
<p class="note">Скриншоты программы на демонстрационных данных.</p>
<figure>
<a href="reestr.png" aria-label="Открыть скриншот реестра в полном размере"><img src="reestr.png" width="1440" height="900" alt="Список договоров с поиском, фильтрами и датами окончания" fetchpriority="high"></a>
<figcaption><h2>Поиск по всему архиву</h2><p>Найдите договор по контрагенту, номеру или сумме. Отдельно видны документы, срок которых скоро истекает.</p><a href="reestr.png">Увеличить скриншот</a></figcaption>
</figure>
<div class="grid">
<figure><a href="zagruzka.png" aria-label="Открыть скриншот загрузки в полном размере"><img src="zagruzka.png" width="1440" height="900" alt="Окно загрузки файлов и папок с договорами" loading="lazy"></a><figcaption><h2>Загрузка пачкой</h2><p>Перетащите отдельные файлы или выберите целую папку. Программа прочитает реквизиты и добавит документы в реестр.</p><a href="zagruzka.png">Увеличить скриншот</a></figcaption></figure>
<figure><a href="kartochka.png" aria-label="Открыть скриншот карточки в полном размере"><img src="kartochka.png" width="1440" height="900" alt="Карточка договора со сроком, суммой и ссылкой на исходный файл" loading="lazy"></a><figcaption><h2>Карточка договора</h2><p>Реквизиты, история изменений и исходный файл доступны из одной карточки.</p><a href="kartochka.png">Увеличить скриншот</a></figcaption></figure>
<figure><a href="analitika.png" aria-label="Открыть скриншот аналитики в полном размере"><img src="analitika.png" width="1440" height="900" alt="Панель с суммами договоров, крупными контрагентами и ближайшими сроками" loading="lazy"></a><figcaption><h2>Сроки и суммы</h2><p>Панель показывает, какие договоры скоро заканчиваются и на каких контрагентов приходится основная сумма.</p><a href="analitika.png">Увеличить скриншот</a></figcaption></figure>
</div>
<footer><a href="../#demo">Другие примеры автоматизации</a></footer>
</main>
</body>
</html>
